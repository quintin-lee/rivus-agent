services:
  backend:
    build: ./backend
    container_name: rivus-agent-backend
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:?MODEL_BASE_URL is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      AGENT_ADDR: ":8080"
      AGENT_DB_PATH: /data/agent.db
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-}
    volumes:
      - rivus-data:/data
      - ./backend/skills:/app/skills
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: rivus-agent-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RIVUS_BACKEND: http://backend:8080
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  rivus-data:
